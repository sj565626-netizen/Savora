name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using $ZIP"
          mkdir -p work
          unzip -q "$ZIP" -d work

      - name: Find project folder
        run: |
          DIR=$(dirname "$(find work -name settings.gradle.kts | head -n 1)")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Project at $DIR"

      - name: Fix library address
        run: sed -i 's/com.github.yausername/io.github.junkfood02/' "$PROJECT_DIR/app/build.gradle.kts"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: Savora-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
