name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Savora.zip
      - run: sed -i 's/com.github.yausername/io.github.junkfood02/' Savora/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: Savora
      - uses: actions/upload-artifact@v4
        with:
          name: Savora-APK
          path: Savora/app/build/outputs/apk/debug/*.apk
